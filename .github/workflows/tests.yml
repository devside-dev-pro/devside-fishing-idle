# Tests EditMode via GameCI. Déclenchement manuel tant que les secrets Unity ne sont pas
# configurés (Settings → Secrets : UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD — voir
# https://game.ci/docs/github/activation). Une fois les secrets en place, remplacer le
# `on:` par push/pull_request pour l'exécuter à chaque PR.
name: tests

on:
  workflow_dispatch:

jobs:
  editmode-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: Library-

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: EditMode
